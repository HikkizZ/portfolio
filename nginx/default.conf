# nginx interno del contenedor (escucha en 80). El nginx-proxy de Nexus le
# llega como portfolio:80; esta config no sabe nada de TLS ni del dominio.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/xml+rss image/svg+xml;

    error_page 404 /404.html;

    # Assets con hash en el nombre (Astro): caché de 1 año, inmutable.
    location ^~ /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # CV, favicon, robots.txt, sitemap, fuentes: caché moderada (1 día).
    location ~* \.(?:pdf|ico|svg|png|jpg|jpeg|webp|avif|txt|xml|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Páginas HTML: nunca cacheadas, siempre revalidadas. try_files resuelve
    # tanto /proyectos/erp como /proyectos/erp/ contra
    # proyectos/erp/index.html (páginas de Astro con barra final), y sirve
    # /404.html vía error_page para cualquier ruta que no exista.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }
}

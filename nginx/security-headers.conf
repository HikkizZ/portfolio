# Headers de seguridad comunes a todas las respuestas. `add_header` dentro
# de un `location` anula los que se hereden del `server`, así que este
# archivo se incluye explícitamente en cada `location` de default.conf en
# vez de declararse una sola vez arriba.
#
# La CSP de scripts/estilos (con los hashes SHA-256 de los inline) la
# genera Astro por página en un <meta http-equiv="Content-Security-Policy">
# (security.csp: true en astro.config.mjs). Este header de nginx no repite
# default-src/script-src/style-src a propósito: si lo hiciera, al no tener
# los hashes por página, terminaría bloqueando esos mismos scripts que el
# <meta> permite (las políticas de <meta> y de header se combinan por
# intersección). Este header solo cubre lo que el <meta> no puede dar:
# frame-ancestors no funciona en <meta>, y de paso se agregan el resto de
# directivas que no dependen del contenido de cada página.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'none'; img-src 'self' data:; font-src 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=()" always;
